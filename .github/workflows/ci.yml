name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run verify:physics
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser -- /tmp/pnigeus-review/browser.json
      - run: python3 scripts/physics_oracle.py /tmp/pnigeus-review/browser.json
      - run: python3 scripts/audio-oracle.py /tmp/pnigeus-review/browser.json
