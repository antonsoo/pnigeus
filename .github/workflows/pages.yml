name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Update the published branch
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git fetch origin gh-pages
          publication_dir="$RUNNER_TEMP/pnigeus-pages"
          git worktree add --detach "$publication_dir" origin/gh-pages
          cp -a dist/. "$publication_dir/"
          touch "$publication_dir/.nojekyll"
          git -C "$publication_dir" config user.name "github-actions[bot]"
          git -C "$publication_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publication_dir" add -A
          if ! git -C "$publication_dir" diff --cached --quiet; then
            git -C "$publication_dir" commit -m "deploy: ${SOURCE_REVISION}"
            git -C "$publication_dir" push origin HEAD:gh-pages
          fi
          # Retain previous hashed assets for legacy cached entry pages.
